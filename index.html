<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafbfc">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ツモナビ">
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(r){
      r.update();
      if(r.waiting){ r.waiting.postMessage('skipWaiting'); }
      r.addEventListener('updatefound', function(){
        var nw = r.installing; if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state === 'installed' && navigator.serviceWorker.controller){ nw.postMessage('skipWaiting'); }
        });
      });
    }).catch(function(){});
  });
}
</script>
<title>ツモナビAI ｜ 今日と明日の狙い目</title>
<style>
  :root{
    --bg:#fafbfc; --card:#ffffff; --ink:#16181d; --ink2:#667085; --ink3:#98a2b3;
    --line:#eceef2; --accent:#d92d20; --chip:#f2f4f7;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101216; --card:#171a20; --ink:#f2f4f7; --ink2:#98a2b3; --ink3:#667085; --line:#23262e; --accent:#f04438; --chip:#1f232b; }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Hiragino Sans","Yu Gothic",-apple-system,sans-serif; background:var(--bg); color:var(--ink); padding:20px 18px 32px; max-width:560px; margin:0 auto; line-height:1.6; padding-bottom:76px;}
  a{color:inherit;}
  .nav{display:flex; gap:18px; margin-bottom:22px; font-size:13px; font-weight:700;}
  .nav a{text-decoration:none; color:var(--ink3); padding-bottom:2px;}
  .nav a.here{color:var(--ink); border-bottom:2px solid var(--ink);}
  .brand{font-size:13px; font-weight:900; letter-spacing:.5px;}
  .brand small{font-weight:600; color:var(--ink3); font-size:10px; margin-left:6px;}
  .tagline{font-size:12px; color:var(--ink2); margin-top:2px;}
  .date{font-size:26px; font-weight:800; margin-top:18px; letter-spacing:-.5px;}
  .date small{font-size:14px; font-weight:600; color:var(--ink2); margin-left:6px;}
  .updated{font-size:11px; color:var(--ink3); margin-top:4px;}
  .updated .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:6px;}
  section{margin-top:36px;}
  .sec{font-size:12px; font-weight:800; color:var(--ink3); letter-spacing:1.5px; margin-bottom:14px;}
  .hero{background:var(--card); border-radius:20px; padding:26px 24px;}
  .hero .label{font-size:12px; font-weight:800; color:var(--accent); letter-spacing:1px;}
  .hero .name{font-size:32px; font-weight:900; letter-spacing:-.5px; margin-top:6px; line-height:1.3;}
  .hero .scorewrap{display:flex; align-items:baseline; gap:10px; margin-top:4px;}
  .hero .score{font-size:46px; font-weight:900; color:var(--accent); letter-spacing:-2px; line-height:1;}
  .hero .scorelabel{font-size:13px; font-weight:700; color:var(--ink2);}
  .block{margin-top:20px;}
  .blocklabel{font-size:11px; font-weight:800; color:var(--ink3); letter-spacing:1px; margin-bottom:6px;}
  .kishu{font-size:17px; font-weight:800; line-height:1.9;}
  .kishu .n{color:var(--ink3); font-weight:700; font-size:13px; margin-right:8px;}
  .meta{font-size:14px; font-weight:600; color:var(--ink2);}
  .checks{display:flex; flex-wrap:wrap; gap:14px; margin-top:20px; font-size:12px; font-weight:700; color:var(--ink2);}
  .checks span::before{content:"✓ "; color:var(--accent); font-weight:900;}
  details{margin-top:20px;}
  summary{font-size:13px; font-weight:700; color:var(--ink2); cursor:pointer; list-style:none;}
  summary::after{content:" ▾";}
  .detail-body{margin-top:14px; font-size:13px; color:var(--ink2); display:flex; flex-direction:column; gap:12px;}
  .detail-body b{color:var(--ink);}
  .detail-body .quote{white-space:pre-wrap; background:var(--chip); border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.6; word-break:break-word;}
  .src{font-size:12px; color:var(--ink3);}
  .src a, .detail-body a{color:var(--accent); text-decoration:none; font-weight:700;}
  .tw{margin-top:9px; font-size:11px; color:var(--ink3); font-weight:700; line-height:2.2;}
  .tw a{color:var(--accent); text-decoration:none; font-weight:700; background:var(--chip); border-radius:99px; padding:3px 10px; margin:0 5px 0 0; white-space:nowrap; display:inline-block;}
  .tw a::before{content:"𝕏 "; font-weight:400; opacity:.75;}
  .row{background:var(--card); border-radius:16px; padding:18px 20px; margin-bottom:10px;}
  .row .top{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
  .row .name{font-size:18px; font-weight:800;}
  .row .rscore{font-size:24px; font-weight:900; letter-spacing:-1px;}
  .row .sub{font-size:13px; color:var(--ink2); margin-top:6px; font-weight:600;}
  .row .note{font-size:11px; color:var(--ink3); margin-top:6px;}
  .list{background:var(--card); border-radius:16px; padding:6px 20px;}
  .li{display:flex; align-items:baseline; justify-content:space-between; padding:13px 0; gap:10px; flex-wrap:wrap;}
  .li .tw{flex-basis:100%; margin-top:1px; font-weight:600; line-height:1.9;}
  .li + .li{border-top:1px solid var(--line);}
  .li .name{font-size:14px; font-weight:700; color:var(--ink2);}
  .li .next{font-size:11px; color:var(--ink3); flex:1; text-align:right;}
  .li .lscore{font-size:15px; font-weight:800; color:var(--ink3); min-width:2em; text-align:right;}
  .kekka{background:var(--card); border-radius:16px; padding:18px 20px; font-size:13px; color:var(--ink2);}
  .refresh{background:var(--chip); border:none; color:var(--ink2); font-family:inherit; font-size:11px; font-weight:800; border-radius:8px; padding:4px 12px; cursor:pointer; margin-left:10px;}
  .refresh:active{opacity:.6;}
  .refresh:disabled{opacity:.55;}
  .jisseki{background:var(--card); border-radius:14px; padding:14px 18px; margin-top:16px; display:flex; align-items:center; gap:16px; font-size:12px; font-weight:700; color:var(--ink2); flex-wrap:wrap;}
  .jisseki b{font-size:16px; color:var(--ink);}
  .jisseki .maru{color:var(--accent);}
  .fold{margin-top:36px;}
  .fold > summary{font-size:12px; font-weight:800; color:var(--ink3); letter-spacing:1.5px; cursor:pointer; list-style:none; padding:4px 0;}
  .fold > summary::after{content:" ▾";}
  .fold[open] > summary::after{content:" ▴";}
  .fold section{margin-top:14px;}
  .bottomnav{position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); display:flex; z-index:40; max-width:560px; margin:0 auto; border-radius:14px 14px 0 0;}
  .bottomnav a{flex:1; text-align:center; padding:11px 0 max(11px, env(safe-area-inset-bottom)); font-size:11px; font-weight:800; color:var(--ink3); text-decoration:none;}
  .bottomnav a.on{color:var(--accent);}
  footer{font-size:10px; color:var(--ink3); margin-top:40px; line-height:1.7;}
  footer a{color:var(--ink3);}
  .empty{background:var(--card); border-radius:16px; padding:22px; font-size:13px; color:var(--ink2); line-height:1.7;}
  .ovl{position:fixed; inset:0; background:rgba(250,251,252,.94); display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; z-index:200;}
  @media (prefers-color-scheme: dark){ .ovl{background:rgba(16,18,22,.94);} }
  .ovl.on{display:flex;}
  .spin{width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ovl p{font-size:13px; font-weight:800; color:var(--ink2); letter-spacing:.02em;}
  .toast{position:fixed; left:50%; top:14px; transform:translateX(-50%) translateY(-160%); background:var(--ink); color:var(--bg); font-size:12.5px; font-weight:800; padding:11px 20px; border-radius:99px; z-index:210; box-shadow:0 8px 24px rgba(0,0,0,.20); transition:transform .34s cubic-bezier(.2,.9,.3,1.25); max-width:92vw; text-align:center; line-height:1.45;}
  .toast.on{transform:translateX(-50%) translateY(0);}
  .toast.ok{background:var(--accent); color:#fff;}
  .toast small{display:block; font-weight:700; opacity:.78; font-size:11px; margin-top:2px;}
  .dayswitch{display:flex; gap:8px; margin:0 0 18px;}
  .dayswitch button{flex:1; background:var(--chip); border:1.5px solid transparent; color:var(--ink2); font-family:inherit; font-size:12.5px; font-weight:800; border-radius:11px; padding:10px 6px; cursor:pointer; transition:.15s;}
  .dayswitch button.on{background:var(--card); border-color:var(--ink); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .dayswitch button:active{opacity:.7;}
</style>
</head>
<body>
<div class="nav"><a class="here" href="./">明日の狙い目</a><a href="db.html">法則データベース</a></div>

<header>
  <div class="brand">ツモナビAI<small>TSUMONAVI AI ｜ β</small></div>
  <div class="tagline" id="tagline">明日の店も、狙い目も。— AIが毎晩21時、根拠つきでナビ。</div>
  <div class="date" id="hdate">—</div>
  <div class="updated"><span class="dot"></span><span id="hupdated">読み込み中</span><button class="refresh" onclick="refreshApp()">↻ 更新</button></div>
</header>

<div class="jisseki" id="jisseki"></div>

<div class="dayswitch">
  <button id="btn-today" onclick="showDay('today')">今日</button>
  <button id="btn-tomorrow" onclick="showDay('tomorrow')">明日</button>
</div>

<div id="day-today"></div>
<div id="day-tomorrow" style="display:none"></div>

<section>
  <div class="sec">昨日の答え合わせ</div>
  <div class="kekka" id="kekka">読み込み中</div>
</section>

<footer>
  ツモナビAI β ｜ 予測は店舗公式Xの告知・過去の開催実績（法則DB）・第三者評価から機械的に採点しています。<a href="db.html">法則データベース</a><br>
  遊技はご自身の判断と責任で。結果を保証するものではありません。
</footer>

<div class="bottomnav"><a class="on" href="./">狙い目</a><a href="db.html">法則DB</a></div>
<div class="ovl" id="ovl"><div class="spin"></div><p>最新の情報を取りにいっています…</p></div>
<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------------------
// データ: data/day/<YYYY-MM-DD>.json（公開版）と <YYYY-MM-DD>-member.json（根拠つき）
// tsumonavi-data の predict.yml が毎晩21時(JST)にここへ配信する。
// このページは描画するだけ。予測ロジックは持たない。
// ---------------------------------------------------------------------------
var DATA_BASE = 'data/day/';
var STATE = { today: null, tomorrow: null, dates: {} };

function jstDate(offsetDays){
  var d = new Date(Date.now() + 9*3600*1000 + (offsetDays||0)*86400*1000);
  return d.toISOString().slice(0,10);
}
function jstHour(){ return new Date(Date.now() + 9*3600*1000).getUTCHours(); }
function label(iso){
  var p = iso.split('-'); var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
  return (+p[1]) + '/' + (+p[2]) + '<small>(' + '日月火水木金土'[d.getUTCDay()] + ')</small>';
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function linkify(s){
  return esc(s).replace(/https?:\/\/[^\s]+/g, function(u){ return '<a href="' + u + '" target="_blank" rel="noopener">' + u.replace(/^https?:\/\//,'').slice(0,40) + '</a>'; });
}

function fetchJSON(url){
  return fetch(url + '?t=' + Math.floor(Date.now()/60000), {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error(r.status); return r.json();
  });
}
function loadDay(iso){
  return fetchJSON(DATA_BASE + iso + '-member.json').catch(function(){
    return fetchJSON(DATA_BASE + iso + '.json');      // 会員版が無ければ公開版
  }).catch(function(){ return null; });
}

function breakdownText(p){
  var b = p.breakdown; if(!b) return '';
  return '店格' + b.rank + ' + 法則' + b.rule + ' + 告知' + b.kokuchi + ' + 第三者' + b.third + ' = ' + p.score;
}

function renderHero(p, kind){
  var h = '<section><div class="hero">';
  h += '<div class="label">' + (kind==='today'?'今日':'明日') + 'の本命 ｜ ' + esc(p.area || '') + '</div>';
  h += '<div class="name">' + esc(p.storeName) + '</div>';
  h += '<div class="scorewrap"><span class="score">' + Math.round(p.score) + '</span><span class="scorelabel">' + esc(p.scoreLabel) + '</span></div>';
  if(p.kishu && p.kishu.length){
    h += '<div class="block"><div class="blocklabel">告知に出ている機種</div><div class="kishu">';
    p.kishu.forEach(function(k,i){ h += '<div><span class="n">' + (i+1) + '</span>' + esc(k) + '</div>'; });
    h += '</div></div>';
  }
  if(p.chusen){ h += '<div class="block"><div class="blocklabel">抽選</div><div class="meta">' + esc(p.chusen) + '</div></div>'; }
  if(p.checks && p.checks.length){
    h += '<div class="checks">' + p.checks.map(function(c){ return '<span>' + esc(c) + '</span>'; }).join('') + '</div>';
  }
  if(p.basis && p.basis.length){
    h += '<details><summary>根拠の詳細</summary><div class="detail-body">';
    p.basis.forEach(function(b){
      if(b.title.indexOf('告知:') === 0){
        h += '<div><b>' + esc(b.title) + '</b><div class="quote">' + linkify(b.body) + '</div></div>';
      }else{
        h += '<div><b>' + esc(b.title) + ':</b> ' + esc(b.body) + '</div>';
      }
    });
    if(p.breakdown){ h += '<div class="src">スコア内訳 ' + esc(breakdownText(p)) + '</div>'; }
    h += '</div></details>';
  }
  if(p.sources && p.sources.length){
    h += '<div class="tw">' + p.sources.map(function(s){ return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + '</a>'; }).join('') + '</div>';
  }
  h += '</div></section>';
  return h;
}

function renderRow(p){
  var h = '<div class="row"><div class="top"><span class="name">' + esc(p.storeName) + '</span><span class="rscore">' + Math.round(p.score) + '</span></div>';
  h += '<div class="sub">' + esc(p.scoreLabel) + (p.chusen ? ' ・ ' + esc(p.chusen) : '') + '</div>';
  if(p.checks && p.checks.length){ h += '<div class="note">' + p.checks.map(esc).join(' ／ ') + '</div>'; }
  if(p.breakdown){ h += '<div class="note">' + esc(breakdownText(p)) + '</div>'; }
  if(p.sources && p.sources.length){
    h += '<div class="tw">' + p.sources.map(function(s){ return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + '</a>'; }).join('') + '</div>';
  }
  return h + '</div>';
}

function renderList(items){
  var h = '<div class="list">';
  items.forEach(function(p){
    h += '<div class="li"><span class="name">' + esc(p.storeName) + '</span><span class="next">' + esc((p.checks||[])[0] || '') + '</span><span class="lscore">' + Math.round(p.score) + '</span></div>';
  });
  return h + '</div>';
}

function renderDay(kind, iso, data){
  var el = document.getElementById('day-' + kind);
  if(!data){
    el.innerHTML = '<div class="empty">' + (kind==='tomorrow' ? '明日の予測はまだ出ていません。毎晩21時ごろに更新されます。' : '今日の予測データが見つかりません。') + '</div>';
    return;
  }
  var ps = data.predictions || [];
  var main = ps.filter(function(p){ return p.rank === '本命'; })[0];
  var sub  = ps.filter(function(p){ return p.rank === '対抗' || p.rank === '穴'; });
  var rest = ps.filter(function(p){ return p.rank === 'その他'; });
  var h = '';
  if(main) h += renderHero(main, kind);
  if(sub.length){
    h += '<details class="fold" open><summary>' + (kind==='today'?'今日':'明日') + 'の対抗・穴(' + sub.length + '店)</summary><section>' + sub.map(renderRow).join('') + '</section></details>';
  }
  if(rest.length){
    h += '<details class="fold"><summary>その他(' + rest.length + '店)</summary><section>' + renderList(rest) + '</section></details>';
  }
  var noThird = ps.every(function(p){ return !p.breakdown || p.breakdown.third === 0; });
  if(noThird){ h += '<div class="tw" style="margin-top:14px">第三者評価（ホールナビ等）は未反映。店格・法則・公式Xの告知で採点しています</div>'; }
  el.innerHTML = h;
}

function showDay(k){
  var t = k==='today';
  document.getElementById('day-today').style.display    = t?'':'none';
  document.getElementById('day-tomorrow').style.display = t?'none':'';
  document.getElementById('btn-today').classList.toggle('on', t);
  document.getElementById('btn-tomorrow').classList.toggle('on', !t);
  var iso = STATE.dates[k]; var data = STATE[k];
  document.getElementById('hdate').innerHTML = label(iso);
  document.getElementById('hupdated').textContent = data ? data.updatedAt : '未更新';
  document.getElementById('tagline').textContent = t ? '今日の狙い目 — 開いた時間に合わせて表示しています' : '明日の店も、狙い目も。— AIが毎晩21時、根拠つきでナビ。';
  try{ sessionStorage.setItem('tn_day', k); }catch(e){}
}

function renderMeta(data){
  var j = (data && data.jisseki) || {maru:0, maru2:0, batsu:0, since:''};
  var a = (data && data.analysis) || {};
  var el = document.getElementById('jisseki');
  el.innerHTML = '検証実績' + (j.since ? '(' + esc(j.since) + '開始)' : '') + ': <span><b class="maru">◎' + (j.maru||0) + '</b> 〇' + (j.maru2||0) + ' ×' + (j.batsu||0) + '</span>'
    + '<span style="margin-left:auto; font-weight:600; color:var(--ink3)">法則' + (a.laws||0) + '件 ・ 店舗' + (a.stores||0) + '店 ・ 公式X ' + (a.accounts||0) + '件</span>';
  var k = document.getElementById('kekka');
  var kk = (data && data.kekka) || [];
  if(!kk.length){
    k.innerHTML = '<b>まだ判定できた予測がありません。</b><br>予測を出した翌日以降に、店舗の公表データや第三者の結果レポートと突き合わせて ◎/〇/× を付けます。';
  }else{
    k.innerHTML = kk.map(function(x){ return '・' + esc(x.storeName) + '(予想' + esc(x.predicted) + ') → <b style="color:var(--accent)">' + esc(x.result) + '</b>' + (x.note ? ' ' + esc(x.note) : ''); }).join('<br>');
  }
}

(function init(){
  STATE.dates = { today: jstDate(0), tomorrow: jstDate(1) };
  document.getElementById('btn-today').textContent = '今日 ' + label(STATE.dates.today).replace(/<[^>]+>/g,'');
  document.getElementById('btn-tomorrow').textContent = '明日 ' + label(STATE.dates.tomorrow).replace(/<[^>]+>/g,'');
  Promise.all([loadDay(STATE.dates.today), loadDay(STATE.dates.tomorrow)]).then(function(r){
    STATE.today = r[0]; STATE.tomorrow = r[1];
    renderDay('today', STATE.dates.today, STATE.today);
    renderDay('tomorrow', STATE.dates.tomorrow, STATE.tomorrow);
    renderMeta(STATE.tomorrow || STATE.today);
    var k;
    try{ k = sessionStorage.getItem('tn_day'); }catch(e){}
    if(!k){ k = (jstHour() >= 21 || !STATE.today) && STATE.tomorrow ? 'tomorrow' : 'today'; }
    showDay(k);
    afterRefresh();
  });
})();

function showToast(msg, ms, ok){
  var t = document.getElementById('toast'); if(!t) return;
  t.innerHTML = msg; t.classList.toggle('ok', !!ok); t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, ms || 3800);
}
function currentStamp(){ var d = STATE.tomorrow || STATE.today; return d ? d.targetDate + ' ' + d.updatedAt : ''; }
function refreshApp(){
  var btn = document.querySelector('.refresh');
  if(btn){ btn.disabled = true; btn.textContent = '更新中…'; }
  var ovl = document.getElementById('ovl'); if(ovl){ ovl.classList.add('on'); }
  try{ sessionStorage.setItem('tn_prev_build', currentStamp()); }catch(e){}
  var fired = false, started = Date.now();
  var done = function(){
    if(fired) return; fired = true;
    var go = function(){ var base = location.href.split('#')[0].split('?')[0]; location.replace(base + '?r=' + Date.now()); };
    setTimeout(go, Math.max(0, 700 - (Date.now() - started)));
  };
  var jobs = [];
  if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
    jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister().catch(function(){}); })); }).catch(function(){}));
  }
  if(window.caches && caches.keys){
    jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k).catch(function(){}); })); }).catch(function(){}));
  }
  if(jobs.length === 0){ done(); return; }
  Promise.all(jobs).then(done, done);
  setTimeout(done, 4000);
}
function afterRefresh(){
  if(!/[?&]r=/.test(location.search)) return;
  var prev = '';
  try{ prev = sessionStorage.getItem('tn_prev_build') || ''; sessionStorage.removeItem('tn_prev_build'); }catch(e){}
  var now = currentStamp();
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  setTimeout(function(){
    if(prev && now && prev !== now){ showToast('✓ 新しい情報に更新しました<small>' + esc(now) + '</small>', 4600, true); }
    else{ showToast('すでに最新の状態です<small>' + esc(now) + '</small>', 3800, false); }
  }, 260);
}
</script>
</body>
</html>
